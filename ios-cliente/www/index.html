<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MotoJá</title>
<style>
 :root{--bg:#000000;--text:#f2f2f2;--muted:#b4b4b8;--accent:#f5b400}
 @media (prefers-color-scheme:dark){:root{--bg:#141414;--text:#f2f2f2;--muted:#b4b4b8}}
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
 h1{font-size:24px;margin:12px 0 6px}p{color:var(--muted);margin:0 0 20px}
 button{background:var(--accent);color:#1d1d1f;border:0;border-radius:14px;padding:14px 22px;font:700 17px -apple-system,system-ui,sans-serif}
</style>
</head>
<body>
<main>
 <div style="font-size:54px">🏍️</div>
 <h1>Sem internet agora</h1>
 <p>O MotoJá precisa de internet para mostrar as lojas e acompanhar seu pedido.</p>
 <button type="button" onclick="location.href='https://nexusmotoja.com.br/'">Tentar de novo</button>
</main>
</body>
</html>
