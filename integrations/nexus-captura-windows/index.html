<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>*{box-sizing:border-box}body{margin:0;padding:28px;font:16px system-ui;background:#0c0c10;color:#fff}main{max-width:560px;margin:auto;display:grid;gap:16px}h1{margin:0;color:#ff8a00}p{margin:0;color:#bbb;line-height:1.5}.panel{display:grid;gap:13px;padding:18px;border:1px solid #3b2b1d;border-radius:8px;background:#17171d}label{display:grid;gap:6px;font-weight:700}input{padding:12px;border:1px solid #444;border-radius:7px;background:#24242b;color:#fff}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.check{display:flex;align-items:center;gap:8px}.check input{width:20px;height:20px}button{border:0;border-radius:7px;padding:12px 16px;background:#ff7900;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#303038}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}#status{padding:12px;border-radius:7px;background:#23242a;color:#bfffd2;white-space:pre-wrap}small{color:#999;line-height:1.4}</style></head><body><main><h1>Nexus Captura</h1><p>Leitor local de pedidos impressos para o painel Nexus MotoJa.</p><section class="panel"><label>Servidor<input id="backendUrl"></label><label>WhatsApp da empresa<input id="companyId" inputmode="numeric"></label><label>Chave de captura<input id="captureKey" type="password"></label><label>Pasta dos cupons<div class="row"><input id="watchFolder" readonly><button id="choose" type="button" class="secondary">Escolher</button></div></label><label class="check"><input id="autoStart" type="checkbox"> Iniciar junto com o Windows</label><div class="actions"><button id="save" type="button">Salvar e iniciar</button><button id="stop" type="button" class="secondary">Parar leitura</button></div><div id="status">Aguardando configuracao.</div><small>Formatos: TXT, PRN, SPL com texto e PDF. Se o cupom sair como imagem, configure o BeeFood para imprimir em PDF/TXT nesta pasta.</small></section></main><script src="renderer.js"></script></body></html>
