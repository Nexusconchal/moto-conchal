<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Moto Conchal - Painel do Motoboy</title>
  <meta name="theme-color" content="#ff6b00">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Outfit,system-ui,sans-serif;background:#090911;color:#fff}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(255,107,0,.18),transparent 60%);pointer-events:none}.app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:22px 16px 48px;display:grid;gap:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:grid;gap:2px}.brand small{color:#ff9a00;font-weight:900;letter-spacing:1.3px;text-transform:uppercase}.brand h1{font-size:1.7rem;background:linear-gradient(135deg,#ffd700,#ff6b00);-webkit-background-clip:text;background-clip:text;color:transparent}.pill{padding:8px 12px;border-radius:999px;background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);color:#bfffd2;font-weight:800;font-size:.8rem}.login,.card,.status{border:1px solid rgba(255,154,0,.22);border-radius:18px;background:rgba(255,255,255,.055);box-shadow:0 18px 50px rgba(0,0,0,.35);padding:16px}.login{display:grid;gap:12px}label{display:grid;gap:6px;font-weight:800;font-size:.85rem}input{width:100%;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.07);color:#fff;padding:13px 14px;font:inherit;outline:0}input:focus{border-color:#ff9a00;box-shadow:0 0 0 3px rgba(255,154,0,.14)}button{min-height:48px;border:0;border-radius:999px;background:linear-gradient(135deg,#ff6b00,#ff9a00);color:#fff;font:inherit;font-weight:900;cursor:pointer}button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}button.ok{background:linear-gradient(135deg,#25d366,#128c3e)}button.done{background:linear-gradient(135deg,#4fc3f7,#0288d1)}.grid{display:grid;gap:12px}.card{display:grid;gap:10px}.line{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.muted{color:#aaa;font-size:.85rem;line-height:1.35}.value{font-size:1.55rem;font-weight:900;color:#ffd700}.status{background:rgba(79,195,247,.09);border-color:rgba(79,195,247,.22);color:#c9efff}.empty{text-align:center;color:#999;padding:28px 12px;border:1px dashed rgba(255,255,255,.16);border-radius:18px}.hidden{display:none!important}.danger{color:#ffd2d2;background:rgba(255,82,82,.1);border-color:rgba(255,82,82,.25)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{min-height:42px}@media(max-width:520px){.top,.line{display:grid}.actions,.tabs{grid-template-columns:1fr}.brand h1{font-size:1.45rem}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand"><small>Moto Conchal</small><h1>Painel do Motoboy</h1></div><div id="online" class="pill">Aguardando</div></header>
  <section id="login" class="login">
    <label>Nome completo do motoboy<input id="nome" placeholder="Ex: Rafael Silva" autocomplete="name"></label>
    <label>CPF<input id="cpf" placeholder="Somente numeros" inputmode="numeric" maxlength="14"></label>
    <label>WhatsApp<input id="telefone" placeholder="Ex: 19999999999" inputmode="tel" maxlength="13"></label>
    <label>Senha<input id="senha" placeholder="Senha do painel" type="password"></label>
    <button id="entrar" type="button">Entrar no painel</button>
    <p class="muted">Nome, CPF e WhatsApp ficam salvos no controle do dono junto com as corridas.</p>
  </section>
  <section id="painel" class="hidden grid"><div class="status">Deixe esta tela aberta. Quando chegar corrida nova, ela aparece aqui e toca um aviso.</div><button class="secondary" type="button" onclick="location.href='https://chat.whatsapp.com/HNDcqL2PZEl3KScGrhnigd'">Entrar no grupo dos motoboys</button><div class="tabs"><button id="aba-pendentes" type="button">Corridas pendentes</button><button id="aba-minhas" class="secondary" type="button">Minhas corridas</button></div><div id="lista" class="grid"></div></section>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getFirestore, collection, query, where, onSnapshot, doc, setDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAWY3Y9heJqKL_iTA2jCr4Zw3AQ39jB-Q',authDomain:'moto-conchal.firebaseapp.com',projectId:'moto-conchal',storageBucket:'moto-conchal.firebasestorage.app',messagingSenderId:'904931531597',appId:'1:904931531597:web:14b7c6b35657e3982d3504'};
const app=initializeApp(firebaseConfig),db=getFirestore(app),$=id=>document.getElementById(id);
let motoboy='',motoboyCpf='',motoboyTelefone='',vistos=new Set(),audioLiberado=false,unsubscribe=null,modo='pendentes';
function soNumeros(v){return String(v||'').replace(/\D/g,'')}function cpfOk(cpf){return soNumeros(cpf).length===11}function telefoneOk(t){const n=soNumeros(t);return n.length>=10&&n.length<=11}function moeda(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function ganhoMotoboy(valor){return Number(valor||0)*0.7}function ganhoApp(valor){return Number(valor||0)*0.3}function quando(ts){return new Date((ts?.seconds||Date.now()/1000)*1000).toLocaleString('pt-BR')}function beep(){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=880;gain.gain.value=.12;osc.start();setTimeout(()=>{osc.stop();ctx.close()},260)}catch(e){}}
function detalhes(c){return `<p><strong>Origem:</strong> ${c.origem||'-'}</p><p><strong>Destino:</strong> ${c.destino||'-'}</p><p class="muted"><strong>Encontrado:</strong> ${c.destinoEncontrado||c.destino||'-'}</p><p><strong>Distancia:</strong> ${String(c.km||'-').replace('.',',')} km</p><p><strong>Preco:</strong> ${c.precoLabel||'-'}</p><p><strong>Motoboy recebe:</strong> ${moeda(ganhoMotoboy(c.valor))} (70%)</p><p class="muted"><strong>App fica:</strong> ${moeda(ganhoApp(c.valor))} (30%)</p>`}
function cardPendente(id,c){return `<article class="card"><div class="line"><div><strong>${c.nome||'Cliente'}</strong><p class="muted">${quando(c.criadaEm)}</p></div><div class="value">${moeda(c.valor)}</div></div><div>${detalhes(c)}</div><div class="actions"><button class="ok" data-aceitar="${id}">Aceitar corrida</button><button class="secondary" onclick="location.href='https://api.whatsapp.com/send?phone=5519992306488&text=${encodeURIComponent('Quero falar sobre a corrida '+id)}'">WhatsApp</button></div></article>`}
function cardMinha(id,c){const finalizada=c.status==='finalizada';return `<article class="card"><div class="line"><div><strong>${c.nome||'Cliente'}</strong><p class="muted">Status: ${finalizada?'Finalizada':'Aceita'}${c.finalizadaEm?' - '+quando(c.finalizadaEm):''}</p></div><div class="value">${moeda(ganhoMotoboy(c.valor))}</div></div><div>${detalhes(c)}</div><div class="actions"><button class="done" data-finalizar="${id}" ${finalizada?'disabled':''}>${finalizada?'Corrida finalizada':'Finalizar corrida'}</button><button class="secondary" onclick="location.href='https://api.whatsapp.com/send?phone=5519992306488&text=${encodeURIComponent('Quero falar sobre a corrida '+id)}'">WhatsApp</button></div></article>`}
function render(snap){const lista=$('lista');if(snap.empty){lista.innerHTML=`<div class="empty">${modo==='pendentes'?'Nenhuma corrida pendente agora.':'Nenhuma corrida sua ainda.'}</div>`;return}let nova=false;const docs=snap.docs.sort((a,b)=>(b.data().criadaEm?.seconds||0)-(a.data().criadaEm?.seconds||0));lista.innerHTML=docs.map(d=>{if(modo==='pendentes'&&!vistos.has(d.id)){nova=true;vistos.add(d.id)}return modo==='pendentes'?cardPendente(d.id,d.data()):cardMinha(d.id,d.data())}).join('');if(nova&&audioLiberado)beep();lista.querySelectorAll('[data-aceitar]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;btn.textContent='Aceitando...';await updateDoc(doc(db,'corridas',btn.dataset.aceitar),{status:'aceita',motoboy,motoboyCpf,motoboyTelefone,aceitaEm:serverTimestamp(),atualizadaEm:serverTimestamp()});});lista.querySelectorAll('[data-finalizar]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;btn.textContent='Finalizando...';await updateDoc(doc(db,'corridas',btn.dataset.finalizar),{status:'finalizada',motoboy,motoboyCpf,motoboyTelefone,finalizadaEm:serverTimestamp(),atualizadaEm:serverTimestamp(),ganhoMotoboy:0.7,ganhoApp:0.3});});}
function ouvir(){if(unsubscribe)unsubscribe();const q=modo==='pendentes'?query(collection(db,'corridas'),where('status','==','pendente')):query(collection(db,'corridas'),where('motoboyCpf','==',motoboyCpf));unsubscribe=onSnapshot(q,render,err=>{$('lista').innerHTML=`<div class="status danger">Erro ao carregar corridas: ${err.message}</div>`});$('aba-pendentes').className=modo==='pendentes'?'':'secondary';$('aba-minhas').className=modo==='minhas'?'':'secondary'}
$('aba-pendentes').onclick=()=>{modo='pendentes';ouvir()};$('aba-minhas').onclick=()=>{modo='minhas';ouvir()};$('cpf').addEventListener('input',()=>{$('cpf').value=soNumeros($('cpf').value).slice(0,11)});$('telefone').addEventListener('input',()=>{$('telefone').value=soNumeros($('telefone').value).slice(0,11)});
$('entrar').onclick=async()=>{const senha=$('senha').value.trim();motoboy=$('nome').value.trim();motoboyCpf=soNumeros($('cpf').value);motoboyTelefone=soNumeros($('telefone').value);if(!motoboy){alert('Digite o nome completo');return}if(!cpfOk(motoboyCpf)){alert('Digite um CPF com 11 numeros');return}if(!telefoneOk(motoboyTelefone)){alert('Digite o WhatsApp com DDD');return}if(senha!=='moto123'){alert('Senha incorreta');return}await setDoc(doc(db,'motoboys',motoboyCpf),{nome:motoboy,cpf:motoboyCpf,telefone:motoboyTelefone,status:'ativo',ultimoAcesso:serverTimestamp(),atualizadoEm:serverTimestamp()},{merge:true});audioLiberado=true;beep();$('login').classList.add('hidden');$('painel').classList.remove('hidden');$('online').textContent='Online';ouvir();};
</script>
</body>
</html>
